<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Star Drifter</title><style>body{margin:0;background:#08121d;color:#eaf6ff;font:15px system-ui;text-align:center}h2{color:#9fe5ff}canvas{width:min(96vw,850px);height:auto;border:1px solid #37546a;background:#08121d;touch-action:none}button{padding:10px 18px;background:#17374a;color:white;border:1px solid #5a9eb7;border-radius:6px;cursor:pointer}.help{color:#9bb4c6;font-size:13px}</style></head><body><h2>🚀 STAR DRIFTER</h2><p class="help">Move with WASD or arrow keys. Dodge asteroids and collect blue stardust. Click/tap to steer on touch screens.</p><canvas id="c" width="850" height="540"></canvas><p id="stats">Score: 0 · Best: 0</p><button onclick="reset()">Restart run</button><script>
const c=document.querySelector('canvas'),x=c.getContext('2d');let keys={},ship,rocks,stars,score,best=0,dead,tick,mouse={x:425,y:400,active:false};function reset(){ship={x:425,y:430,vx:0,vy:0};rocks=[];stars=[];score=0;dead=false;tick=0;for(let i=0;i<9;i++)rocks.push({x:Math.random()*850,y:Math.random()*-600,r:12+Math.random()*20,s:65+Math.random()*90});for(let i=0;i<6;i++)stars.push({x:Math.random()*850,y:Math.random()*-800,r:5});}onkeydown=e=>keys[e.key.toLowerCase()]=true;onkeyup=e=>keys[e.key.toLowerCase()]=false;c.onpointermove=e=>{let r=c.getBoundingClientRect();mouse.x=(e.clientX-r.left)*850/r.width;mouse.y=(e.clientY-r.top)*540/r.height};c.onpointerdown=()=>mouse.active=true;c.onpointerup=()=>mouse.active=false;function frame(dt){tick+=dt;if(!dead){score+=dt*4;let ax=(keys.a||keys.arrowleft?-1:0)+(keys.d||keys.arrowright?1:0),ay=(keys.w||keys.arrowup?-1:0)+(keys.s||keys.arrowdown?1:0);if(mouse.active){ax=Math.max(-1,Math.min(1,(mouse.x-ship.x)/55));ay=Math.max(-1,Math.min(1,(mouse.y-ship.y)/55))}ship.vx=(ship.vx+ax*400*dt)*.93;ship.vy=(ship.vy+ay*400*dt)*.93;ship.x=Math.max(15,Math.min(835,ship.x+ship.vx*dt));ship.y=Math.max(15,Math.min(525,ship.y+ship.vy*dt));for(let r of rocks){r.y+=r.s*dt;if(r.y>570){r.y=-30;r.x=Math.random()*850;score+=3}if(Math.hypot(r.x-ship.x,r.y-ship.y)<r.r+10)dead=true}for(let s of stars){s.y+=90*dt;if(s.y>550){s.y=-20;s.x=Math.random()*850}if(Math.hypot(s.x-ship.x,s.y-ship.y)<17){score+=25;s.y=-30;s.x=Math.random()*850}}}x.fillStyle='#08121d';x.fillRect(0,0,850,540);for(let i=0;i<100;i++){let sx=(i*137)%850,sy=(i*79+tick*20)%540;x.fillStyle=i%5?'#57748b':'#b6edff';x.fillRect(sx,sy,2,2)}for(let s of stars){x.fillStyle='#76e7ff';x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill();x.fillStyle='#76e7ff33';x.fillRect(s.x-9,s.y-9,18,18)}for(let r of rocks){x.fillStyle='#69727c';x.beginPath();x.arc(r.x,r.y,r.r,0,7);x.fill();x.fillStyle='#a0aab1';x.fillRect(r.x-r.r/3,r.y-r.r/3,5,5)}x.save();x.translate(ship.x,ship.y);x.fillStyle='#d9f8ff';x.beginPath();x.moveTo(0,-17);x.lineTo(12,13);x.lineTo(0,8);x.lineTo(-12,13);x.fill();x.fillStyle='#54cfff';x.fillRect(-4,12,8,10+Math.sin(tick*20)*4);x.restore();document.getElementById('stats').textContent='Score: '+Math.floor(score)+' · Best: '+Math.floor(best)+(dead?' · CRASHED — restart for another run':'');if(dead)best=Math.max(best,score)}let last=0;function loop(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;frame(dt);requestAnimationFrame(loop)}reset();requestAnimationFrame(loop);
</script></body></html>
