<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rune Clicker</title><style>body{margin:0;background:#171323;color:#f2eaff;font:15px system-ui;text-align:center}.wrap{max-width:650px;margin:35px auto;padding:20px}.orb{width:170px;height:170px;margin:25px auto;border-radius:50%;border:2px solid #bda0ff;background:radial-gradient(circle at 35% 30%,#e0d1ff,#8060bf 35%,#342252 72%);box-shadow:0 0 35px #9e70f877;display:grid;place-items:center;font-size:65px;cursor:pointer;user-select:none}.orb:active{transform:scale(.96)}button{width:100%;margin:6px 0;padding:12px;background:#35284e;border:1px solid #8868b8;color:#f2eaff;border-radius:7px;cursor:pointer;text-align:left}button:disabled{opacity:.45}.stat{font-size:24px;color:#d7c2ff}small{color:#b7a9cc}</style></head><body><div class="wrap"><h1>🔮 RUNE CLICKER</h1><p>Tap the rune to gather mana. Buy upgrades to generate mana automatically.</p><div class="stat" id="mana">0 mana</div><div class="orb" onclick="tap()">✧</div><p><small id="rate">0 mana per second</small></p><h2>Arcane Research</h2><div id="shop"></div><button onclick="reset()">Reset progress</button></div><script>
let mana=0,per=1,auto=0,upgrades=[{n:'Apprentice Wand',d:'Click power +1',c:15,fn:()=>per++},{n:'Mana Sprite',d:'+1 mana per second',c:40,fn:()=>auto++},{n:'Crystal Focus',d:'Double click power',c:120,fn:()=>per*=2},{n:'Arcane Library',d:'+8 mana per second',c:300,fn:()=>auto+=8},{n:'Archmage Sigil',d:'Multiply all production ×2',c:900,fn:()=>{per*=2;auto*=2}}];let levels=[0,0,0,0,0];function tap(){mana+=per;draw()}function buy(i){let u=upgrades[i],cost=Math.floor(u.c*Math.pow(1.65,levels[i]));if(mana<cost)return;mana-=cost;levels[i]++;u.fn();draw()}function draw(){document.getElementById('mana').textContent=Math.floor(mana)+' mana';document.getElementById('rate').textContent=auto+' mana per second · '+per+' per tap';document.getElementById('shop').innerHTML=upgrades.map((u,i)=>{let c=Math.floor(u.c*Math.pow(1.65,levels[i]));return `<button onclick="buy(${i})" ${mana<c?'disabled':''}><b>${u.n}</b> — ${c} mana<br><small>${u.d} · owned ${levels[i]}</small></button>`}).join('')}function reset(){if(confirm('Reset all mana and upgrades?')){mana=0;per=1;auto=0;levels=[0,0,0,0,0];draw()}}setInterval(()=>{mana+=auto/10;draw()},100);draw();
</script></body></html>
